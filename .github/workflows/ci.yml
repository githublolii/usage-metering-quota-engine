name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: typecheck · build · test (self-contained PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `embedded-postgres` and `esbuild` ship postinstall scripts. npm's
      # allow-scripts blocks unknown install scripts by default in some
      # setups; approve both explicitly so the embedded database binaries
      # and the tsx/esbuild tool are fully installed.
      - name: Approve install scripts for embedded-postgres + esbuild
        run: |
          npm install-scripts approve @embedded-postgres/linux-x64 || true
          npm install-scripts approve esbuild || true

      - name: Install dependencies
        run: npm ci || npm install

      - name: Type-check (strict)
        run: npx tsc -p tsconfig.json --noEmit

      - name: Production build
        run: npm run build

      # Zero-config: the suite boots a pristine embedded PostgreSQL per run
      # (migrations + seed included). Set TEST_DATABASE_URL to use an
      # external service instead.
      - name: Test (unit + integration + concurrency storms)
        run: npm test

  benchmark:
    name: concurrency benchmark (manual runs)
    runs-on: ubuntu-latest
    # Benchmarks are for evidence generation, not pass/fail gating: shared
    # runners have noisy neighbors. Invariants ARE asserted, so failures
    # still surface — but timing numbers are advisory.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Load test (500-way storms, SQL-verified invariants)
        run: npm run load-test
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            perf/results/
          retention-days: 30
