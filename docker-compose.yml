services:
  postgres:
    image: postgres:16-alpine
    container_name: metering-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: metering
      # Deterministic timestamps: run the cluster in UTC.
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - metering_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d metering"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metering-api
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/metering
      DB_POOL_MAX: "20"
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: unless-stopped

volumes:
  metering_pgdata:
